name: Daily Apartment Price Notion Sync

on:
  schedule:
    # 매일 아침 8시(한국시간 기준) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼 생성

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests
      - name: Run script
        run: python main.py
