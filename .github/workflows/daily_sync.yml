name: Weekly Apartment Price & AI Report Sync

on:
  schedule:
    # 한국시간(KST) 기준 매주 월요일 오전 8시 자동 실행 (UTC 일요일 23:00)
    - cron: '0 23 * * 0'
  workflow_dispatch: # 필요 시 언제든 수동 실행 가능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
